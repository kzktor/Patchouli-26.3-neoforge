pluginManagement {
    plugins {
        id 'net.neoforged.moddev' version mdg_version apply false
        id 'net.fabricmc.fabric-loom' version loom_version apply false
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
    }
}

plugins {
    // Required for NeoGradle
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'Patchouli'
// Only the NeoForge target is built here. The Fabric subproject is left out entirely: it needs
// Fabric Loom (a `1.15-SNAPSHOT` plugin, i.e. a moving target) and nothing in this port consumes it.
// Xplat stays — it holds the shared sources and NeoForge's build.gradle compiles them in via
// `source xplat.sourceSets.main.allSource`.
include("Xplat", "NeoForge")
